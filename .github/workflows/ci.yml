name: Verify Doom FERRO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source, WAD and gameplay
        run: node --test tests/*.test.mjs
      - name: Build static game
        run: python3 tools/build.py
      - name: Verify committed build is reproducible
        run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: doom-ferro-0.1.0
          path: dist/
